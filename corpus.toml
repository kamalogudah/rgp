# Contract: docs/configuration.md#corpus-toml
schema_version = 1

[corpus]
# The checked-in corpus is offline-first: `rgp corpus sync` materializes
# pinned snapshots, and `rgp analyze` works without network access once they
# are present. Revisions are immutable 40-character Git commit SHAs.
offline = true

